name: Package Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed wheel outside the checkout
        run: |
          cp -R tests "$RUNNER_TEMP/auto-quote-tests"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s auto-quote-tests -v
